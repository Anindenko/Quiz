<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Результат</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/result.css">
</head>
<body>

<header class="header">
    <section class="container">
        <picture class="logo">
            <img src="assets/image/logo.png" alt="Логотип">
        </picture>
    </section>
</header>

<main class="result">
    <section class="container">
        <picture class="result-image">
            <img src="assets/image/question-marks.png" alt="Знаки вопросов">
        </picture>
        <h1 class="result-title big-title">
            Ура! Ты прошёл тест! <span>Твой результат:</span>
        </h1>
        <span class="result-score" id="result-score"></span>
        <article class="result-transition">
            <a href="answer.html" id="result-link">Посмотреть правильные ответы <img src="assets/image/small-arrow.png" alt="Cтрелочка"></a>
        </article>
    </section>
</main>

<footer class="footer">
    «АйтилогияQuiz» © Все права защищены / 2022
</footer>

<script src="js/common.js"></script>
<script src="js/result.js"></script>
</body>
</html>
