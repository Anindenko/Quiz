<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/choice.css">
</head>
<body>

<header class="header">
    <section class="container">
        <picture class="logo">
            <img src="assets/image/logo.png" alt="Логотип">
        </picture>
    </section>
</header>

<main class="choice">
    <section class="container">
        <article class="choice-content">
            <h1 class="common-title choice-title">Выберите <span>тему теста</span></h1>

                Чтобы начать тест, выберите одну из предложенных ниже тем.
            </p>
            <section class="choice-options" id="choice-options"></section>
        </article>
        <picture class="choice-image">
            <img src="assets/image/choice-image.png" alt="Персонажи">
        </picture>
    </section>
</main>

<footer class="footer">
    «АйтилогияQuiz» © Все права защищены / 2022
</footer>

<script src="js/common.js"></script>
